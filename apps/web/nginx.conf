# Nginx 配置：托管前端静态资源 + 反代后端 API

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不能缓存，否则发版后用户拿不到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反代到后端容器（compose 里的服务名就是 api）
    location /api/ {
 proxy_pass http://api:3000;
        proxy_http_version 1.1;
 proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 必需的三项，缺一个流式输出就会被攒住 ----
        # AI 分析走 text/event-stream，nginx 默认会缓冲整个响应体，
        # 导致前端看不到逐字输出，而是等全部生成完才一次性收到。
 proxy_buffering off;
        proxy_cache off;
 # 模型生成可能超过一分钟，读超时要放宽
        proxy_read_timeout 300s;
    }

    # SPA 路由回退：/dashboard 这类前端路由直接刷新时也能进入应用
    location / {
        try_files $uri $uri/ /index.html;
    }
}
